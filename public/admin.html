<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活动后台</title><style>body{margin:0;background:#06091b;color:#fff;font-family:Arial,"Microsoft YaHei";padding:30px}.box{max-width:500px;margin:auto;background:#ffffff10;padding:28px;border-radius:18px}input,button{width:100%;padding:13px;margin:8px 0;border-radius:8px;border:0}button{cursor:pointer;background:#e8d77c}.danger{background:#a33;color:#fff}</style></head><body><div class="box"><h1>✦ 活动后台</h1><input id="key" type="password" placeholder="管理员密码"><input id="stars" type="number" min="0" placeholder="当前星星"><input id="target" type="number" min="1" placeholder="目标数量"><button onclick="save()">保存</button><button class="danger" onclick="resetAll()">重置星星</button><p>视频始终可以从活动主页手动播放。</p></div><script>async function load(){let d=await(await fetch("/api/data")).json();stars.value=d.stars;target.value=d.target}async function save(){let r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key.value},body:JSON.stringify({stars:stars.value,target:target.value})});alert(r.ok?"已保存":"密码错误");load()}async function resetAll(){let r=await fetch("/api/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-key":key.value},body:JSON.stringify({reset:true})});alert(r.ok?"已重置":"密码错误");load()}load()</script></body></html>
