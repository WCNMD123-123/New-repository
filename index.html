<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030817">
<title>点亮星空</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="sky"></canvas>

<main>
  <div class="eyebrow">每一次相遇</div>
  <h1>都会点亮一颗星</h1>

  <div class="count">
    <strong id="stars">0</strong>
    <span>颗星星</span>
  </div>

  <div class="progress"><i id="bar"></i></div>
  <div class="goal"><span id="cur">0</span> / <span id="target">500</span></div>

  <p id="msg">正在连接星空……</p>

  <button id="play" type="button">播放惊喜视频</button>
  <div class="hint">每一次扫码，都会让星空多一颗星</div>
</main>

<div id="videoBox" aria-hidden="true">
  <div class="videoInner">
    <button id="close" type="button" aria-label="关闭">×</button>
    <video id="video" controls playsinline preload="metadata"></video>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
</body>
</html>
