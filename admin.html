<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>点亮星空后台</title><style>body{margin:0;min-height:100vh;background:#050817;color:#fff;font-family:Arial,"Microsoft YaHei";padding:28px}.box{max-width:520px;margin:40px auto;background:#ffffff0d;border:1px solid #ffffff1c;border-radius:20px;padding:28px}input,button{width:100%;padding:13px;margin:8px 0;border-radius:9px;border:1px solid #ffffff22}input{background:#0006;color:#fff}button{background:#eee0a0;color:#111;font-weight:600;cursor:pointer}.danger{background:#a83b4b;color:#fff}.secondary{background:#ffffff15;color:#fff}#panel{display:none}</style></head><body><div class="box"><h1>✦ 点亮星空｜活动后台</h1><div id="login"><input id="email" type="email" placeholder="管理员邮箱"><input id="password" type="password" placeholder="管理员密码"><button id="loginBtn">登录</button></div><div id="panel"><p id="who"></p><input id="stars" type="number" min="0" placeholder="当前星星"><input id="target" type="number" min="1" placeholder="目标数量"><button id="save">保存设置</button><button id="reset" class="danger">重置星星为 0</button><button id="logout" class="secondary">退出登录</button><p id="status"></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script>const{createClient}=window.supabase,client=createClient(SUPABASE_URL,SUPABASE_KEY),$=x=>document.getElementById(x);async function load(){let{data,error}=await client.rpc("get_activity");if(error){$("status").textContent=error.message;return}$("stars").value=data.stars;$("target").value=data.target}async function auth(){let{data}=await client.auth.getSession();if(data.session){$("login").style.display="none";$("panel").style.display="block";$("who").textContent="已登录："+data.session.user.email;load()}else{$("login").style.display="block";$("panel").style.display="none"}}$("loginBtn").onclick=async()=>{let{error}=await client.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(error)alert("登录失败："+error.message);else auth()};$("save").onclick=async()=>{let{error}=await client.from("activity").update({stars:Math.max(0,Number($("stars").value)||0),target:Math.max(1,Number($("target").value)||500)}).eq("id",1);$("status").textContent=error?error.message:"已保存";if(!error)load()};$("reset").onclick=async()=>{if(!confirm("确定重置星星为 0？"))return;let{error}=await client.from("activity").update({stars:0}).eq("id",1);$("status").textContent=error?error.message:"已重置";if(!error)load()};$("logout").onclick=async()=>{await client.auth.signOut();auth()};auth();</script></body></html>
